<!doctype html>
<html lang="th" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>

    <!-- โหลด Tailwind CSS สำหรับจัดการดีไซน์ -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- เชื่อมต่อไฟล์สไตล์ CSS ส่วนตัว -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-900 text-white overflow-x-hidden">
    <!-- ส่วนที่ 1: พื้นที่ Parallax (รูปภาพลอยตรงกลางและผลงานรอบตัว) -->
    <section id="parallax-section" class="relative h-[200vh] w-full">
      <!-- กล่องยึดตำแหน่งให้อยู่ตรงกลางหน้าจอขณะเลื่อน -->
      <div
        class="sticky top-0 h-screen w-full flex items-center justify-center overflow-hidden relative"
      >
        <!-- ข้อความ PORTFOLIO (ใส่ ID และเพิ่มคลาส break-all เพื่อให้ตัดบรรทัด) -->
        <h1 id="portfolio-text" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 font-black text-gray-800/60 tracking-widest z-0 select-none pointer-events-none break-all w-full text-center leading-[0.8]">
          PORTFOLIO
        </h1>

        <!-- รูปภาพโปรไฟล์ของคุณ (เริ่มที่ครึ่งตัวบน และย่อลงเมื่อเลื่อน) -->
        <img
          id="MyFullbody-image"
          src="./assets/Thanakorn_FullBody.png"
          alt="MyFullBody"
          class="object-cover transition-transform duration-75 ease-out max-h-[80vh] w-auto origin-[50%_-15%] scale-[2.2]"
        />

        <!-- Box1 -->
        <div class="floating-project project-1 absolute top-[25%] left-[20%]">
          <div
            class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 w-48"
          >
            <h3 class="text-blue-400 font-bold mb-2">About Me</h3>
            <p class="text-xs text-gray-300">""ประวัติส่วนตัว เป้าหมาย และเรื่องราวความเป็นมาของผม""</p>
          </div>
        </div>

        <!-- Box2 -->
        <div
          class="floating-project project-2 absolute top-[25%] right-[20%]"
        >
          <div
            class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 w-48"
          >
            <h3 class="text-pink-400 font-bold mb-2">My Skills</h3>
            <p class="text-xs text-gray-300">"ทักษะ ความรู้ และโปรแกรมหรือภาษาคอมพิวเตอร์ที่ใช้งานได้"</p>
          </div>
        </div>

        <!-- Box3 -->
        <div class="floating-project project-3 absolute bottom-[20%] left-[20%]">
          <div
            class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 w-48"
          >
            <h3 class="text-white-400 font-bold mb-2">Contact</h3>
            <p class="text-xs text-gray-300">"รวมผลงานและโปรเจคต่างๆ ที่เคยทำผ่านมาทั้งหมด"</p>
          </div>
        </div>

         <!-- Box4 -->
        <div class="floating-project project-4 absolute bottom-[20%] right-[20%]">
          <div
            class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 w-48"
          >
            <h3 class="text-green-400 font-bold mb-2">My Projects</h3>
            <p class="text-xs text-gray-300">"ช่องทางในการติดต่อ พูดคุย หรือสอบถามข้อมูลเพิ่มเติม"</p>
          </div>
        </div>
        
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
